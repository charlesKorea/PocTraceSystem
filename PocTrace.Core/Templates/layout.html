<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <script>
        (function () {
            var theme = 'light';
            try { theme = localStorage.getItem('poc_theme') || 'light'; } catch (e) {}
            if (theme !== 'dark') theme = 'light';
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.setAttribute('data-bs-theme', theme);
        })();
    </script>

    <!-- 로컬 assets만 사용 (CDN 금지). 차트: echarts -->
    <link href="./assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="./assets/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="./assets/css/buttons.dataTables.min.css" rel="stylesheet">
    <link href="./assets/css/bootstrap-icons.min.css" rel="stylesheet">
    <link href="./assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="app-frame">
        <header class="report-top">
            <a class="brand-link" href="index.html">M-Link <span>Pipe Trace</span></a>
            <ul class="report-nav" id="main-nav">
                <li>
                    <a class="nav-link {{ACTIVE_SUMMARY}}" href="index.html" data-i18n="nav_summary">Summary</a>
                </li>
                <li>
                    <a class="nav-link {{ACTIVE_RULES}}" href="rules.html" data-i18n="nav_rules">Check Rules</a>
                </li>
                <li>
                    <a class="nav-link {{ACTIVE_PROGRESS}}" href="progress.html" data-i18n="nav_progress">Design Progress</a>
                </li>
            </ul>
            <div class="top-tools">
                <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false">
                    <span class="when-light" data-i18n="theme_dark">다크</span>
                    <span class="when-dark" data-i18n="theme_light">라이트</span>
                </button>
                <button type="button" id="cmdk-open" class="cmdk-trigger">
                    <span data-i18n="cmdk_open">검색</span>
                    <kbd>Ctrl</kbd><kbd>K</kbd>
                </button>
                <select id="lang-selector" class="form-select form-select-sm" aria-label="language">
                    <option value="en">English</option>
                    <option value="ko" selected>한국어</option>
                    <option value="zh">中文</option>
                </select>
                <span class="meta-date" id="meta-date"></span>
            </div>
        </header>

        <div class="app-body">
            <aside class="line-rail" id="line-rail" aria-label="lines">
                <div class="rail-label" data-i18n="rail_lines">라인</div>
                <ul id="line-nav"></ul>
            </aside>
            <main class="report-main" id="main-container">
                <div class="text-center mt-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">Loading Dashboard...</p>
                </div>
            </main>
        </div>
    </div>

    <div class="cmdk" id="cmdk" hidden>
        <div class="cmdk-backdrop" data-cmdk-close></div>
        <div class="cmdk-panel" role="dialog" aria-modal="true" aria-label="search">
            <input id="cmdk-input" type="text" autocomplete="off" spellcheck="false" placeholder="Search">
            <ul class="cmdk-list" id="cmdk-list"></ul>
        </div>
    </div>

    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="detailModalLabel">Detail Info</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body"></div>
            </div>
        </div>
    </div>

    <script src="./assets/js/jquery.min.js"></script>
    <script src="./assets/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/echarts.min.js"></script>
    <script src="./assets/js/jszip.min.js"></script>
    <script src="./assets/js/lodash.min.js"></script>
    <script src="./assets/js/dayjs.min.js"></script>
    <script src="./assets/js/jquery.dataTables.min.js"></script>
    <script src="./assets/js/dataTables.bootstrap5.min.js"></script>
    <script src="./assets/js/dataTables.buttons.min.js"></script>
    <script src="./assets/js/buttons.html5.min.js"></script>

    <script src="./assets/js/lang.js"></script>
    <script src="./assets/js/poc-core.js"></script>
    <script src="./assets/js/poc-charts.js"></script>
    <script src="./assets/js/poc-grid.js"></script>
    <script src="./assets/js/poc-similar.js"></script>
    <script src="./assets/js/poc-action.js"></script>
    <script src="./assets/js/poc-rules.js"></script>
    <script src="./assets/js/poc-progress.js"></script>
    {{DATA_SCRIPT}}
    <script src="./assets/js/app.js"></script>
</body>
</html>
