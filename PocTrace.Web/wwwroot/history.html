<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PocTrace 검수 기록</title>
  <link rel="icon" href="/assets/jcs-ui/brand/mark.ico" />
  <link rel="stylesheet" href="/assets/jcs-ui/jcs-glass.css" />
</head>
<body>
  <header class="topbar">
    <a class="back" id="back" href="/">검수 화면</a>
    <div class="tools">
      <div class="theme" role="group" aria-label="theme">
        <button type="button" id="themeBtn" aria-pressed="false">다크</button>
      </div>
      <div class="lang" role="group" aria-label="language">
        <button type="button" id="langKo">한국어</button>
        <button type="button" id="langZh">中文</button>
      </div>
    </div>
  </header>
  <main class="wrap">
    <section class="card">
      <h1 id="title">검수 기록</h1>
      <p id="lead" class="hint"></p>
      <div class="notice" id="sharedNotice" hidden></div>
      <form class="filters" id="filters" autocomplete="off">
        <div>
          <label for="fUser" id="lUser">사용자</label>
          <select id="fUser"></select>
        </div>
        <div>
          <label for="fMethod" id="lMethod">검수 방식</label>
          <select id="fMethod"></select>
        </div>
        <div>
          <label for="fLine" id="lLine">라인</label>
          <select id="fLine"></select>
        </div>
        <div>
          <label for="fFrom" id="lFrom">시작일</label>
          <input id="fFrom" type="date" />
        </div>
        <div>
          <label for="fTo" id="lTo">종료일</label>
          <input id="fTo" type="date" />
        </div>
        <div>
          <label for="fText" id="lText">검수대상 검색</label>
          <input id="fText" type="search" />
        </div>
      </form>
      <div class="actions">
        <button id="historyFind" class="primary" type="button">조회</button>
        <button id="historyReset" class="ghost" type="button">조건 초기화</button>
        <a id="historyExcel" class="primary" href="#">Excel 다운로드</a>
        <span class="hint" id="countLine"></span>
      </div>
      <div class="table-wrap history-table">
        <table id="historyTable">
          <thead>
            <tr>
              <th id="hWhen">날짜</th>
              <th id="hUser">사용자</th>
              <th id="hMethod">검수 방식</th>
              <th id="hLine">라인</th>
              <th id="hTarget">검수대상</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    var TEXT = {
      ko: {
        title: "검수 기록",
        lead: "모든 사용자의 기록입니다. 같은 검수의 대상은 한 줄에 하나씩 나옵니다.",
        back: "검수 화면",
        when: "날짜", user: "사용자", method: "검수 방식", line: "라인", target: "검수대상",
        from: "시작일", to: "종료일", search: "검수대상 검색",
        all: "전체",
        find: "조회", reset: "조건 초기화", excel: "Excel 다운로드",
        empty: "조건에 맞는 기록이 없습니다.",
        fail: "기록을 읽지 못했습니다.",
        count: "{n}행",
        truncated: "{n}행까지만 보여 줍니다. 조건을 좁혀 주세요.",
        sharedOk: "공용 폴더 {path} 의 기록을 함께 보고 있습니다.",
        sharedFail: "공용 폴더를 읽지 못해 이 PC의 기록만 보입니다. ({path}) {error}",
        themeDark: "다크", themeLight: "라이트",
        methods: { trace: "배관 Trace", batch: "배치 Trace", demolition: "철거검수", nozzle: "노즐추적" }
      },
      zh: {
        title: "检查记录",
        lead: "这是所有用户的记录。同一次检查的对象各占一行。",
        back: "检查画面",
        when: "日期", user: "用户", method: "检查方式", line: "线路", target: "检查对象",
        from: "开始日期", to: "结束日期", search: "搜索检查对象",
        all: "全部",
        find: "查询", reset: "重置条件", excel: "下载 Excel",
        empty: "没有符合条件的记录。",
        fail: "无法读取记录。",
        count: "{n} 行",
        truncated: "最多显示 {n} 行。请缩小条件。",
        sharedOk: "同时显示公用文件夹 {path} 的记录。",
        sharedFail: "无法读取公用文件夹，仅显示本机记录。({path}) {error}",
        themeDark: "深色", themeLight: "浅色",
        methods: { trace: "Pipe Trace", batch: "Batch Trace", demolition: "拆除检验", nozzle: "Nozzle Trace" }
      }
    };
    function $(id) { return document.getElementById(id); }
    function lang() {
      var saved = localStorage.getItem("poc_lang");
      return saved === "zh" ? "zh" : "ko";
    }
    function theme() {
      var saved = localStorage.getItem("poc_theme");
      if (saved === "dark" || saved === "light") return saved;
      return "light";
    }
    function pack() { return TEXT[lang()] || TEXT.ko; }
    function fill(template, map) {
      return String(template || "").replace(/\{(\w+)\}/g, function (_, key) {
        return map[key] == null ? "" : map[key];
      });
    }
    var lastData = null;

    function applyChrome() {
      var mode = theme();
      document.documentElement.setAttribute("data-theme", mode);
      document.documentElement.lang = lang() === "zh" ? "zh-CN" : "ko";
      var t = pack();
      document.title = t.title;
      $("title").textContent = t.title;
      $("lead").textContent = t.lead;
      $("back").textContent = t.back;
      $("hWhen").textContent = t.when;
      $("hUser").textContent = t.user;
      $("hMethod").textContent = t.method;
      $("hLine").textContent = t.line;
      $("hTarget").textContent = t.target;
      $("lUser").textContent = t.user;
      $("lMethod").textContent = t.method;
      $("lLine").textContent = t.line;
      $("lFrom").textContent = t.from;
      $("lTo").textContent = t.to;
      $("lText").textContent = t.search;
      $("historyFind").textContent = t.find;
      $("historyReset").textContent = t.reset;
      $("historyExcel").textContent = t.excel;
      $("themeBtn").textContent = mode === "dark" ? t.themeLight : t.themeDark;
      $("themeBtn").setAttribute("aria-pressed", mode === "dark" ? "true" : "false");
      $("langKo").className = lang() === "ko" ? "active" : "";
      $("langZh").className = lang() === "zh" ? "active" : "";
    }
    function savePrefs() {
      fetch("/api/prefs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lang: lang(), theme: theme() })
      }).catch(function () {});
    }
    function pad(n) { return n < 10 ? "0" + n : String(n); }
    function when(iso) {
      var date = new Date(iso);
      if (isNaN(date.getTime())) return iso || "";
      return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate())
        + " " + pad(date.getHours()) + ":" + pad(date.getMinutes());
    }
    function dayString(date) {
      return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate());
    }
    function esc(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function methodName(value) {
      var t = pack();
      return (t.methods && t.methods[value]) || value || "";
    }

    function fillSelect(select, values, current, labeler) {
      var t = pack();
      select.innerHTML = "";
      var all = document.createElement("option");
      all.value = "";
      all.textContent = t.all;
      select.appendChild(all);
      (values || []).forEach(function (value) {
        var opt = document.createElement("option");
        opt.value = value;
        opt.textContent = labeler ? labeler(value) : value;
        select.appendChild(opt);
      });
      select.value = current || "";
      if (select.value !== (current || "")) select.value = "";
    }
    function queryString(extra) {
      var parts = [];
      function add(key, value) {
        if (value) parts.push(key + "=" + encodeURIComponent(value));
      }
      add("user", $("fUser").value);
      add("method", $("fMethod").value);
      add("line", $("fLine").value);
      add("from", $("fFrom").value);
      add("to", $("fTo").value);
      add("q", $("fText").value.trim());
      if (extra) parts.push(extra);
      return parts.length ? "?" + parts.join("&") : "";
    }
    function paintNotice(data) {
      var t = pack();
      var box = $("sharedNotice");
      var shared = data.shared || {};
      box.hidden = false;
      if (shared.available) {
        box.className = "notice";
        box.textContent = fill(t.sharedOk, { path: shared.path });
      } else {
        box.className = "notice warn";
        box.textContent = fill(t.sharedFail, { path: shared.path, error: shared.error || "" });
      }
    }
    function paint(data) {
      var t = pack();
      var rows = data.rows || [];
      var body = $("rows");
      body.innerHTML = "";
      if (!rows.length) {
        body.innerHTML = "<tr><td class='empty' colspan='5'>" + esc(t.empty) + "</td></tr>";
      }
      rows.forEach(function (row) {
        var tr = document.createElement("tr");
        tr.innerHTML =
          "<td>" + esc(when(row.at)) + "</td>" +
          "<td>" + esc(row.userName || "-") + "</td>" +
          "<td>" + esc(methodName(row.method)) + "</td>" +
          "<td>" + esc(row.line || "") + "</td>" +
          "<td>" + esc(row.target || "") + "</td>";
        body.appendChild(tr);
      });
      var count = fill(t.count, { n: rows.length });
      if (data.truncated) count += " · " + fill(t.truncated, { n: data.maxRows });
      $("countLine").textContent = count;
      $("historyExcel").href = "/api/history/excel" + queryString("lang=" + lang());
    }
    async function load(keepFilters) {
      var t = pack();
      var prev = keepFilters ? { user: $("fUser").value, method: $("fMethod").value, line: $("fLine").value } : { user: "", method: "", line: "" };
      try {
        var res = await fetch("/api/history" + queryString());
        var data = await res.json();
        if (!res.ok) throw new Error((data && data.error) || t.fail);
        lastData = data;
        fillSelect($("fUser"), data.users, prev.user);
        fillSelect($("fMethod"), data.methods, prev.method, methodName);
        fillSelect($("fLine"), data.lines, prev.line);
        paintNotice(data);
        paint(data);
      } catch (err) {
        $("rows").innerHTML = "<tr><td class='empty' colspan='5'>" + esc(t.fail) + "</td></tr>";
      }
    }
    function resetFilters() {
      var to = new Date();
      var from = new Date();
      from.setDate(from.getDate() - 30);
      $("fFrom").value = dayString(from);
      $("fTo").value = dayString(to);
      $("fText").value = "";
      $("fUser").value = "";
      $("fMethod").value = "";
      $("fLine").value = "";
    }
    async function boot() {
      applyChrome();
      try {
        var pref = await fetch("/api/prefs");
        if (pref.ok) {
          var data = await pref.json();
          if (data.lang === "ko" || data.lang === "zh") localStorage.setItem("poc_lang", data.lang);
          if (data.theme === "light" || data.theme === "dark") localStorage.setItem("poc_theme", data.theme);
          applyChrome();
        }
      } catch (err) { /* 브라우저에 남은 설정을 쓴다 */ }
      resetFilters();
      await load(false);
    }
    function rerender() {
      applyChrome();
      if (lastData) {
        var cur = { user: $("fUser").value, method: $("fMethod").value, line: $("fLine").value };
        fillSelect($("fUser"), lastData.users, cur.user);
        fillSelect($("fMethod"), lastData.methods, cur.method, methodName);
        fillSelect($("fLine"), lastData.lines, cur.line);
        paintNotice(lastData);
        paint(lastData);
      }
    }
    $("themeBtn").onclick = function () {
      localStorage.setItem("poc_theme", theme() === "dark" ? "light" : "dark");
      applyChrome();
      savePrefs();
    };
    $("langKo").onclick = function () {
      localStorage.setItem("poc_lang", "ko");
      savePrefs();
      rerender();
    };
    $("langZh").onclick = function () {
      localStorage.setItem("poc_lang", "zh");
      savePrefs();
      rerender();
    };
    $("historyFind").onclick = function () { load(true); };
    $("historyReset").onclick = function () { resetFilters(); load(false); };
    $("filters").addEventListener("submit", function (event) { event.preventDefault(); load(true); });
    $("fText").addEventListener("keydown", function (event) {
      if (event.key === "Enter") { event.preventDefault(); load(true); }
    });
    ["fUser", "fMethod", "fLine", "fFrom", "fTo"].forEach(function (id) {
      $(id).addEventListener("change", function () { load(true); });
    });
    $("historyExcel").addEventListener("click", function () {
      $("historyExcel").href = "/api/history/excel" + queryString("lang=" + lang());
    });
    boot();
  </script>
</body>
</html>
